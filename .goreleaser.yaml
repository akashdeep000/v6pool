# goreleaser configuration (v2 format).
# Release with:  goreleaser release --clean  (CI: .github/workflows/release.yml)
version: 2

project_name: v6pool

builds:
  - id: v6pool
    main: ./cmd/v6pool
    binary: v6pool
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64, arm, 386]
    goarm: [7]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
